name: Convert ALF to ULF
on: workflow_dispatch

jobs:
  activate_license:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install unity-license-activate
        run: npm install --global unity-license-activate

      - name: Activate the license
        # Я уже вписал сюда имя вашего файла!
        run: |
          unity-license-activate "${{ secrets.UNITY_EMAIL }}" "${{ secrets.UNITY_PASSWORD }}" "Unity_v2022.3.alf"
        continue-on-error: true

      - name: Upload ULF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity-License-ULF
          path: "*.ulf"

      - name: Upload Error Screenshot (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Error-Screenshot
          path: error.png
